# Homelab deploy manifest for the ODES UI — k3s + Traefik + private Harbor.
#
# Deployed by the homelab Jenkins `deploy-to-k3s` pipeline, which substitutes the
# `__IMAGE__` placeholder with the freshly built Harbor image. This is separate
# from app/infra/k8s/ui.yaml (which targets the DigitalOcean/nginx production
# cluster) — do not mix the two.
#
# Pipeline params: K8S_MANIFEST_PATH=app/infra/k8s/homelab/ui.yaml, K8S_NAMESPACE=apps
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: odes-ui
  namespace: apps
  labels: { app: odes-ui }
spec:
  replicas: 1
  selector:
    matchLabels: { app: odes-ui }
  template:
    metadata:
      labels: { app: odes-ui }
    spec:
      # Private Harbor project — pull secret lives once in the shared `apps` ns.
      imagePullSecrets:
        - name: harbor
      containers:
        - name: ui
          image: __IMAGE__
          ports:
            - containerPort: 80
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 128Mi }
          readinessProbe:
            httpGet: { path: /, port: 80 }
            initialDelaySeconds: 3
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: odes-ui
  namespace: apps
spec:
  selector: { app: odes-ui }
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: odes-ui
  namespace: apps
  # Homepage auto-discovers this and shows a tile on the hub.
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: ODES
    gethomepage.dev/description: Scheduling UI
    gethomepage.dev/group: Apps
    gethomepage.dev/icon: si-buffer
spec:
  ingressClassName: traefik
  rules:
    - host: odes.homelab.lan
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: odes-ui
                port:
                  number: 80
