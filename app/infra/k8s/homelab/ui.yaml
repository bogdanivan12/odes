# Homelab deploy manifest for the ODES UI — k3s + Traefik + private Harbor.
#
# Deployed by the homelab Jenkins `deploy-to-k3s` pipeline, which substitutes the
# `__IMAGE__` placeholder with the freshly built Harbor image. This is separate
# from app/infra/k8s/ui.yaml (which targets the DigitalOcean/nginx production
# cluster) — do not mix the two.
#
# No `namespace:` here on purpose — the pipeline applies with `-n apps-<repo>`
# (e.g. apps-odes) and seeds the Harbor pull secret + default SA there, so no
# imagePullSecrets are needed either. Public exposure (PUBLIC / PRIVATE_TO_ME) is
# managed per run by the pipeline, not in this manifest.
#
# Pipeline params: K8S_MANIFEST_PATH=app/infra/k8s/homelab/ui.yaml, SERVICE_NAME=odes-ui
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: odes-ui
  labels: { app: odes-ui }
spec:
  replicas: 1
  selector:
    matchLabels: { app: odes-ui }
  template:
    metadata:
      labels: { app: odes-ui }
    spec:
      containers:
        - name: ui
          image: __IMAGE__
          ports:
            - containerPort: 80
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 128Mi }
          readinessProbe:
            httpGet: { path: /, port: 80 }
            initialDelaySeconds: 3
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: odes-ui
spec:
  selector: { app: odes-ui }
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: odes-ui
  # Homepage auto-discovers this and shows a tile on the hub. The `group` is set by
  # the deploy pipeline to the repo name (nested under "Apps"), so it's omitted here.
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: ODES
    gethomepage.dev/description: Scheduling UI
    gethomepage.dev/icon: mdi-calendar-clock
spec:
  ingressClassName: traefik
  rules:
    # Internal only (LAN, wildcard *.homelab.lan). Public exposure is managed by
    # the pipeline per run (creates a separate <svc>-public Ingress for
    # <host>.webodes.app), not here.
    - host: odes.homelab.lan
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: odes-ui
                port:
                  number: 80
